<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagnostic Check - Jaiswal Workforce</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #0f172a; color: #e2e8f0; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { color: #fbbf24; }
        h2 { color: #3b82f6; margin-top: 20px; }
        .result { padding: 10px; margin: 5px 0; border-radius: 5px; }
        .pass { background: #166534; color: #4ade80; }
        .fail { background: #7f1d1d; color: #f87171; }
        .warn { background: #78350f; color: #fbbf24; }
        .info { background: #1e40af; color: #60a5fa; }
        pre { background: #1e293b; padding: 10px; border-radius: 5px; overflow-x: auto; }
        button { background: #3b82f6; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; margin: 10px 0; }
        button:hover { background: #2563eb; }
        .test-section { margin: 20px 0; padding: 15px; background: #1e293b; border-radius: 8px; }
        .test-title { font-weight: bold; margin-bottom: 10px; color: #fbbf24; }
        #console-output { background: #000; padding: 10px; border-radius: 5px; margin-top: 20px; max-height: 300px; overflow-y: auto; font-size: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Jaiswal Workforce - System Diagnostic</h1>
        
        <div id="console-output"></div>
        
        <div class="test-section">
            <div class="test-title">1. Supabase Connection Test</div>
            <button onclick="testSupabase()">Test Supabase Connection</button>
            <div id="supabaseResults"></div>
        </div>
        
        <div class="test-section">
            <div class="test-title">2. Authentication Test</div>
            <button onclick="testAuth()">Test Authentication</button>
            <div id="authResults"></div>
        </div>
        
        <div class="test-section">
            <div class="test-title">3. Database Tables Test</div>
            <button onclick="testTables()">Test Database Tables</button>
            <div id="tableResults"></div>
        </div>
        
        <div class="test-section">
            <div class="test-title">4. Worker CRUD Test</div>
            <button onclick="testWorkerCRUD()">Test Worker CRUD</button>
            <div id="crudResults"></div>
        </div>
        
        <div class="test-section">
            <div class="test-title">5. Attendance Test</div>
            <button onclick="testAttendance()">Test Attendance</button>
            <div id="attendanceResults"></div>
        </div>
        
        <div class="test-section">
            <div class="test-title">6. Financial Calculations Test</div>
            <button onclick="testFinancials()">Test Financials</button>
            <div id="financialResults"></div>
        </div>
        
        <div class="test-section">
            <div class="test-title">7. Run ALL Tests</div>
            <button onclick="runAllTests()">Run Complete Diagnostic</button>
            <div id="allResults"></div>
        </div>
    </div>

    <!-- Load Supabase - This must be BEFORE our script -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        // Console output function
        function logToConsole(message, type = 'info') {
            const consoleDiv = document.getElementById('console-output');
            const div = document.createElement('div');
            div.style.color = type === 'error' ? '#f87171' : type === 'success' ? '#4ade80' : '#60a5fa';
            div.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            consoleDiv.appendChild(div);
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
        }
        
        // Supabase config - UPDATE WITH YOUR ACTUAL VALUES
        const SUPABASE_URL = 'https://yqjuolwntlrnslaxyjsk.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlxanVvbHdudGxybnNsYXh5anNrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxODgyNzUsImV4cCI6MjEwMzc2NDI3NX0.eXH0tVe7kmUCKOwiwqOatSrlVONMZoblGG7_jwyPcqU'; // REPLACE THIS!
        
        logToConsole('Initializing diagnostic...');
        logToConsole('Supabase URL: ' + SUPABASE_URL);
        
        // Check if Supabase library loaded
        if (typeof window.supabase === 'undefined') {
            logToConsole('❌ Supabase library NOT loaded!', 'error');
            document.getElementById('console-output').innerHTML += '<div style="color:red">❌ Supabase library NOT loaded! Check CDN script.</div>';
        } else {
            logToConsole('✅ Supabase library loaded successfully');
            logToConsole('Supabase global object type: ' + typeof window.supabase);
            
            // Create client - this is the KEY FIX
            let supabaseClient;
            try {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                logToConsole('✅ Supabase client created successfully');
                logToConsole('Client type: ' + typeof supabaseClient);
                
                // Test the client
                if (supabaseClient && typeof supabaseClient.from === 'function') {
                    logToConsole('✅ supabase.from is a function - CLIENT WORKS!');
                } else {
                    logToConsole('❌ supabase.from is NOT a function', 'error');
                    logToConsole('Client keys: ' + Object.keys(supabaseClient).join(', '));
                }
                
                // Store as global for use in test functions
                window.supabaseClient = supabaseClient;
                
                // Test session
                supabaseClient.auth.getSession().then(({ data, error }) => {
                    if (error) {
                        logToConsole('❌ Session error: ' + error.message, 'error');
                    } else {
                        logToConsole('✅ Session check: ' + (data.session ? 'Active' : 'None'));
                        if (data.session) {
                            logToConsole('👤 User: ' + data.session.user.email, 'success');
                            window.currentUser = data.session.user;
                        }
                    }
                }).catch(err => {
                    logToConsole('❌ Connection error: ' + err.message, 'error');
                });
                
            } catch (err) {
                logToConsole('❌ Client creation failed: ' + err.message, 'error');
            }
        }
        
        // Helper to get the client
        function getClient() {
            if (!window.supabaseClient) {
                logToConsole('❌ Supabase client not initialized!', 'error');
                return null;
            }
            return window.supabaseClient;
        }
        
        // Add result function
        function addResult(containerId, status, message, detail = '') {
            const container = document.getElementById(containerId);
            if (!container) {
                logToConsole(`Container ${containerId} not found!`, 'error');
                return;
            }
            const div = document.createElement('div');
            div.className = `result ${status}`;
            div.innerHTML = `<strong>${message}</strong>${detail ? `<br><small>${detail}</small>` : ''}`;
            container.appendChild(div);
            logToConsole(message + (detail ? ' - ' + detail : ''), status === 'fail' ? 'error' : status === 'pass' ? 'success' : 'info');
        }
        
        function clearResults(containerId) {
            const container = document.getElementById(containerId);
            if (container) container.innerHTML = '';
        }
        
        // Test 1: Supabase Connection
        async function testSupabase() {
            logToConsole('Testing Supabase connection...');
            clearResults('supabaseResults');
            addResult('supabaseResults', 'info', '📡 Testing Supabase connection...');
            
            const client = getClient();
            if (!client) {
                addResult('supabaseResults', 'fail', '❌ No Supabase client');
                return;
            }
            
            try {
                const { data, error } = await client.from('workers').select('*').limit(1);
                
                if (error) {
                    addResult('supabaseResults', 'fail', '❌ Supabase connection failed', error.message);
                    logToConsole('❌ Error: ' + error.message, 'error');
                } else {
                    addResult('supabaseResults', 'pass', '✅ Supabase connected successfully');
                    addResult('supabaseResults', 'pass', '✅ Can query workers table');
                    logToConsole('✅ Workers query successful', 'success');
                }
            } catch (err) {
                addResult('supabaseResults', 'fail', '❌ Supabase connection error', err.message);
                logToConsole('❌ Exception: ' + err.message, 'error');
            }
        }
        
        // Test 2: Authentication
        async function testAuth() {
            logToConsole('Testing authentication...');
            clearResults('authResults');
            addResult('authResults', 'info', '🔑 Testing authentication...');
            
            const client = getClient();
            if (!client) {
                addResult('authResults', 'fail', '❌ No Supabase client');
                return;
            }
            
            try {
                const { data: { user }, error } = await client.auth.getUser();
                
                if (error) {
                    addResult('authResults', 'fail', '❌ Authentication error', error.message);
                } else if (user) {
                    addResult('authResults', 'pass', '✅ User authenticated', `Email: ${user.email}`);
                    addResult('authResults', 'pass', '✅ User ID: ' + user.id);
                    window.currentUser = user;
                } else {
                    addResult('authResults', 'warn', '⚠️ No user logged in');
                }
            } catch (err) {
                addResult('authResults', 'fail', '❌ Authentication error', err.message);
            }
        }
        
        // Test 3: Database Tables
        async function testTables() {
            logToConsole('Testing database tables...');
            clearResults('tableResults');
            addResult('tableResults', 'info', '🗄️ Testing database tables...');
            
            const client = getClient();
            if (!client) {
                addResult('tableResults', 'fail', '❌ No Supabase client');
                return;
            }
            
            const tables = ['workers', 'attendance', 'worker_transactions', 'audit_log'];
            
            for (const table of tables) {
                try {
                    const { data, error } = await client.from(table).select('*').limit(5);
                    
                    if (error) {
                        addResult('tableResults', 'fail', `❌ ${table} table error`, error.message);
                    } else {
                        addResult('tableResults', 'pass', `✅ ${table} table accessible`, `${data.length} records found`);
                    }
                } catch (err) {
                    addResult('tableResults', 'fail', `❌ ${table} table error`, err.message);
                }
            }
        }
        
        // Test 4: Worker CRUD
        async function testWorkerCRUD() {
            logToConsole('Testing Worker CRUD...');
            clearResults('crudResults');
            addResult('crudResults', 'info', '🔄 Testing Worker CRUD operations...');
            
            const client = getClient();
            if (!client) {
                addResult('crudResults', 'fail', '❌ No Supabase client');
                return;
            }
            
            try {
                const { data: { user } } = await client.auth.getUser();
                if (!user) {
                    addResult('crudResults', 'warn', '⚠️ Login required for CRUD test');
                    return;
                }
                
                // Test Create
                addResult('crudResults', 'info', 'Testing CREATE...');
                const testWorker = {
                    owner_id: user.id,
                    name: 'TEST_' + Date.now(),
                    role: 'Test Worker',
                    daily_rate: 500,
                    active: true
                };
                
                const { data: worker, error: createError } = await client
                    .from('workers')
                    .insert(testWorker)
                    .select()
                    .single();
                
                if (createError) {
                    addResult('crudResults', 'fail', '❌ CREATE failed', createError.message);
                } else {
                    addResult('crudResults', 'pass', '✅ CREATE works', `ID: ${worker.id}`);
                    
                    // Test Read
                    addResult('crudResults', 'info', 'Testing READ...');
                    const { data: readData, error: readError } = await client
                        .from('workers')
                        .select('*')
                        .eq('id', worker.id)
                        .single();
                    
                    if (readError) {
                        addResult('crudResults', 'fail', '❌ READ failed', readError.message);
                    } else {
                        addResult('crudResults', 'pass', '✅ READ works', `Name: ${readData.name}`);
                    }
                    
                    // Test Update
                    addResult('crudResults', 'info', 'Testing UPDATE...');
                    const { error: updateError } = await client
                        .from('workers')
                        .update({ daily_rate: 600 })
                        .eq('id', worker.id);
                    
                    if (updateError) {
                        addResult('crudResults', 'fail', '❌ UPDATE failed', updateError.message);
                    } else {
                        addResult('crudResults', 'pass', '✅ UPDATE works');
                    }
                    
                    // Test Delete
                    addResult('crudResults', 'info', 'Testing DELETE...');
                    const { error: deleteError } = await client
                        .from('workers')
                        .update({ active: false })
                        .eq('id', worker.id);
                    
                    if (deleteError) {
                        addResult('crudResults', 'fail', '❌ DELETE failed', deleteError.message);
                    } else {
                        addResult('crudResults', 'pass', '✅ DELETE works');
                    }
                }
            } catch (err) {
                addResult('crudResults', 'fail', '❌ CRUD test error', err.message);
            }
        }
        
        // Test 5: Attendance
        async function testAttendance() {
            logToConsole('Testing attendance...');
            clearResults('attendanceResults');
            addResult('attendanceResults', 'info', '📋 Testing attendance marking...');
            
            const client = getClient();
            if (!client) {
                addResult('attendanceResults', 'fail', '❌ No Supabase client');
                return;
            }
            
            try {
                const { data: { user } } = await client.auth.getUser();
                if (!user) {
                    addResult('attendanceResults', 'warn', '⚠️ Login required for attendance test');
                    return;
                }
                
                // Get first worker
                const { data: workers } = await client
                    .from('workers')
                    .select('*')
                    .eq('active', true)
                    .limit(1);
                
                if (!workers || workers.length === 0) {
                    addResult('attendanceResults', 'warn', '⚠️ No workers found');
                    return;
                }
                
                const worker = workers[0];
                const today = new Date().toISOString().split('T')[0];
                
                addResult('attendanceResults', 'info', `Testing with worker: ${worker.name}`);
                
                // Test marking attendance
                const { data, error } = await client
                    .rpc('apply_attendance_with_payment', {
                        p_worker_id: worker.id,
                        p_work_date: today,
                        p_status: 'present',
                        p_wage_amount: worker.daily_rate,
                        p_payment_amount: 0
                    });
                
                if (error) {
                    addResult('attendanceResults', 'fail', '❌ Attendance marking failed', error.message);
                    logToConsole('❌ RPC Error: ' + error.message, 'error');
                    
                    // Check if function exists
                    addResult('attendanceResults', 'info', 'Checking if function exists...');
                    const { error: funcError } = await client.rpc('apply_attendance_with_payment', {
                        p_worker_id: '00000000-0000-0000-0000-000000000000',
                        p_work_date: today,
                        p_status: 'present',
                        p_wage_amount: 0,
                        p_payment_amount: 0
                    });
                    
                    if (funcError && funcError.message.includes('Worker not found')) {
                        addResult('attendanceResults', 'pass', '✅ Function exists but worker not found');
                        logToConsole('✅ Function exists', 'success');
                    } else if (funcError) {
                        addResult('attendanceResults', 'fail', '❌ Function might not exist', funcError.message);
                        logToConsole('❌ Function error: ' + funcError.message, 'error');
                    }
                } else {
                    addResult('attendanceResults', 'pass', '✅ Attendance marking works', JSON.stringify(data));
                    logToConsole('✅ Attendance marked successfully', 'success');
                    
                    // Verify attendance saved
                    const { data: savedAtt } = await client
                        .from('attendance')
                        .select('*')
                        .eq('worker_id', worker.id)
                        .eq('work_date', today);
                    
                    if (savedAtt && savedAtt.length > 0) {
                        addResult('attendanceResults', 'pass', '✅ Attendance saved in database', `Status: ${savedAtt[0].status}`);
                        logToConsole('✅ Attendance confirmed in database', 'success');
                    } else {
                        addResult('attendanceResults', 'fail', '❌ Attendance NOT saved in database');
                        logToConsole('❌ Attendance not found in database after save', 'error');
                    }
                }
            } catch (err) {
                addResult('attendanceResults', 'fail', '❌ Attendance test error', err.message);
                logToConsole('❌ Exception: ' + err.message, 'error');
            }
        }
        
        // Test 6: Financial Calculations
        async function testFinancials() {
            logToConsole('Testing financial calculations...');
            clearResults('financialResults');
            addResult('financialResults', 'info', '🧮 Testing financial calculations...');
            
            const client = getClient();
            if (!client) {
                addResult('financialResults', 'fail', '❌ No Supabase client');
                return;
            }
            
            try {
                const { data: { user } } = await client.auth.getUser();
                if (!user) {
                    addResult('financialResults', 'warn', '⚠️ Login required for financial test');
                    return;
                }
                
                // Get all workers
                const { data: workers } = await client
                    .from('workers')
                    .select('*')
                    .eq('active', true);
                
                if (!workers || workers.length === 0) {
                    addResult('financialResults', 'warn', '⚠️ No workers found');
                    return;
                }
                
                for (const worker of workers) {
                    // Get attendance
                    const { data: attendance } = await client
                        .from('attendance')
                        .select('*')
                        .eq('worker_id', worker.id);
                    
                    // Get transactions
                    const { data: transactions } = await client
                        .from('worker_transactions')
                        .select('*')
                        .eq('worker_id', worker.id);
                    
                    // Calculate totals
                    const totalWages = attendance?.reduce((sum, a) => sum + (a.wage_amount || 0), 0) || 0;
                    const totalPayments = attendance?.reduce((sum, a) => sum + (a.payment_amount || 0), 0) || 0;
                    
                    const totalAdvance = transactions
                        ?.filter(t => t.transaction_type === 'advance')
                        .reduce((sum, t) => sum + t.amount, 0) || 0;
                    
                    const totalPaid = transactions
                        ?.filter(t => t.transaction_type === 'payment')
                        .reduce((sum, t) => sum + t.amount, 0) || 0;
                    
                    const netBalance = totalWages - totalAdvance - totalPaid;
                    
                    addResult('financialResults', 'pass', `✅ ${worker.name}:`, 
                        `Wages: ₹${totalWages}, Advance: ₹${totalAdvance}, Paid: ₹${totalPaid}, Balance: ₹${netBalance}`);
                    
                    logToConsole(`${worker.name}: Wages ₹${totalWages}, Advance ₹${totalAdvance}, Paid ₹${totalPaid}, Balance ₹${netBalance}`, 'success');
                }
            } catch (err) {
                addResult('financialResults', 'fail', '❌ Financial test error', err.message);
                logToConsole('❌ Exception: ' + err.message, 'error');
            }
        }
        
        // Run ALL Tests
        async function runAllTests() {
            logToConsole('Running complete diagnostic...');
            clearResults('allResults');
            addResult('allResults', 'info', '🚀 Running complete diagnostic...');
            
            await testSupabase();
            await testAuth();
            await testTables();
            await testWorkerCRUD();
            await testAttendance();
            await testFinancials();
            
            addResult('allResults', 'pass', '✅ All tests completed!');
            logToConsole('✅ Diagnostic complete!', 'success');
        }
        
        // Log initial status
        logToConsole('Diagnostic page loaded. Click buttons to test.');
        logToConsole(`Supabase URL: ${SUPABASE_URL}`);
        
        if (SUPABASE_ANON_KEY === 'YOUR_ACTUAL_ANON_KEY_HERE') {
            logToConsole('⚠️ WARNING: Replace SUPABASE_ANON_KEY with your actual anon key!', 'error');
        }
    </script>
</body>
</html>
