<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagnostic Check - Jaiswal Workforce</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: monospace; padding: 20px; background: #0f172a; color: #e2e8f0; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { color: #fbbf24; }
        h2 { color: #3b82f6; margin-top: 20px; }
        .result { padding: 10px; margin: 5px 0; border-radius: 5px; }
        .pass { background: #166534; color: #4ade80; }
        .fail { background: #7f1d1d; color: #f87171; }
        .warn { background: #78350f; color: #fbbf24; }
        .info { background: #1e40af; color: #60a5fa; }
        pre { background: #1e293b; padding: 10px; border-radius: 5px; overflow-x: auto; }
        button { background: #3b82f6; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; margin: 10px 0; }
        button:hover { background: #2563eb; }
        input { padding: 5px; margin: 5px; border-radius: 3px; border: 1px solid #334155; background: #0f172a; color: white; }
        .test-section { margin: 20px 0; padding: 15px; background: #1e293b; border-radius: 8px; }
        .test-title { font-weight: bold; margin-bottom: 10px; color: #fbbf24; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Jaiswal Workforce - System Diagnostic</h1>
        
        <div class="test-section">
            <div class="test-title">1. Supabase Configuration Test</div>
            <button onclick="testSupabase()">Test Supabase Connection</button>
            <div id="supabaseResults"></div>
        </div>
        
        <div class="test-section">
            <div class="test-title">2. Authentication Test</div>
            <button onclick="testAuth()">Test Authentication</button>
            <div id="authResults"></div>
        </div>
        
        <div class="test-section">
            <div class="test-title">3. Database Tables Test</div>
            <button onclick="testTables()">Test Database Tables</button>
            <div id="tableResults"></div>
        </div>
        
        <div class="test-section">
            <div class="test-title">4. Worker CRUD Test</div>
            <button onclick="testWorkerCRUD()">Test Worker CRUD</button>
            <div id="crudResults"></div>
        </div>
        
        <div class="test-section">
            <div class="test-title">5. Attendance Test</div>
            <button onclick="testAttendance()">Test Attendance</button>
            <div id="attendanceResults"></div>
        </div>
        
        <div class="test-section">
            <div class="test-title">6. Financial Calculations Test</div>
            <button onclick="testFinancials()">Test Financials</button>
            <div id="financialResults"></div>
        </div>
        
        <div class="test-section">
            <div class="test-title">7. Run ALL Tests</div>
            <button onclick="runAllTests()">Run Complete Diagnostic</button>
            <div id="allResults"></div>
        </div>
    </div>

    <script>
        // Supabase config
        const SUPABASE_URL = 'https://yqjuolwntlrnslaxyjsk.supabase.co';
        const SUPABASE_ANON_KEY = window.__SUPABASE_ANON_KEY__ || 'your_key_here';
        
        // Initialize Supabase
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        function addResult(containerId, status, message, detail = '') {
            const container = document.getElementById(containerId);
            const div = document.createElement('div');
            div.className = `result ${status}`;
            div.innerHTML = `<strong>${message}</strong>${detail ? `<br><small>${detail}</small>` : ''}`;
            container.appendChild(div);
        }
        
        function clearResults(containerId) {
            document.getElementById(containerId).innerHTML = '';
        }
        
        // Test 1: Supabase Connection
        async function testSupabase() {
            clearResults('supabaseResults');
            addResult('supabaseResults', 'info', '📡 Testing Supabase connection...');
            
            try {
                const { data, error } = await supabase.from('workers').select('*').limit(1);
                
                if (error) {
                    addResult('supabaseResults', 'fail', '❌ Supabase connection failed', error.message);
                } else {
                    addResult('supabaseResults', 'pass', '✅ Supabase connected successfully');
                    addResult('supabaseResults', 'pass', '✅ Can query workers table');
                }
            } catch (err) {
                addResult('supabaseResults', 'fail', '❌ Supabase connection error', err.message);
            }
        }
        
        // Test 2: Authentication
        async function testAuth() {
            clearResults('authResults');
            addResult('authResults', 'info', '🔑 Testing authentication...');
            
            try {
                const { data: { user }, error } = await supabase.auth.getUser();
                
                if (error) {
                    addResult('authResults', 'fail', '❌ Authentication error', error.message);
                } else if (user) {
                    addResult('authResults', 'pass', '✅ User authenticated', `Email: ${user.email}`);
                    addResult('authResults', 'pass', '✅ User ID: ' + user.id);
                } else {
                    addResult('authResults', 'warn', '⚠️ No user logged in');
                }
            } catch (err) {
                addResult('authResults', 'fail', '❌ Authentication error', err.message);
            }
        }
        
        // Test 3: Database Tables
        async function testTables() {
            clearResults('tableResults');
            addResult('tableResults', 'info', '🗄️ Testing database tables...');
            
            const tables = ['workers', 'attendance', 'worker_transactions', 'audit_log'];
            
            for (const table of tables) {
                try {
                    const { data, error } = await supabase.from(table).select('*').limit(5);
                    
                    if (error) {
                        addResult('tableResults', 'fail', `❌ ${table} table error`, error.message);
                    } else {
                        addResult('tableResults', 'pass', `✅ ${table} table accessible`, `${data.length} records found`);
                    }
                } catch (err) {
                    addResult('tableResults', 'fail', `❌ ${table} table error`, err.message);
                }
            }
        }
        
        // Test 4: Worker CRUD
        async function testWorkerCRUD() {
            clearResults('crudResults');
            addResult('crudResults', 'info', '🔄 Testing Worker CRUD operations...');
            
            try {
                const { data: { user } } = await supabase.auth.getUser();
                if (!user) {
                    addResult('crudResults', 'warn', '⚠️ Login required for CRUD test');
                    return;
                }
                
                // Test Create
                addResult('crudResults', 'info', 'Testing CREATE...');
                const testWorker = {
                    owner_id: user.id,
                    name: 'TEST_' + Date.now(),
                    role: 'Test Worker',
                    daily_rate: 500,
                    active: true
                };
                
                const { data: worker, error: createError } = await supabase
                    .from('workers')
                    .insert(testWorker)
                    .select()
                    .single();
                
                if (createError) {
                    addResult('crudResults', 'fail', '❌ CREATE failed', createError.message);
                } else {
                    addResult('crudResults', 'pass', '✅ CREATE works', `ID: ${worker.id}`);
                    
                    // Test Read
                    addResult('crudResults', 'info', 'Testing READ...');
                    const { data: readData, error: readError } = await supabase
                        .from('workers')
                        .select('*')
                        .eq('id', worker.id)
                        .single();
                    
                    if (readError) {
                        addResult('crudResults', 'fail', '❌ READ failed', readError.message);
                    } else {
                        addResult('crudResults', 'pass', '✅ READ works', `Name: ${readData.name}`);
                    }
                    
                    // Test Update
                    addResult('crudResults', 'info', 'Testing UPDATE...');
                    const { error: updateError } = await supabase
                        .from('workers')
                        .update({ daily_rate: 600 })
                        .eq('id', worker.id);
                    
                    if (updateError) {
                        addResult('crudResults', 'fail', '❌ UPDATE failed', updateError.message);
                    } else {
                        addResult('crudResults', 'pass', '✅ UPDATE works');
                    }
                    
                    // Test Delete
                    addResult('crudResults', 'info', 'Testing DELETE...');
                    const { error: deleteError } = await supabase
                        .from('workers')
                        .update({ active: false })
                        .eq('id', worker.id);
                    
                    if (deleteError) {
                        addResult('crudResults', 'fail', '❌ DELETE failed', deleteError.message);
                    } else {
                        addResult('crudResults', 'pass', '✅ DELETE works');
                    }
                }
            } catch (err) {
                addResult('crudResults', 'fail', '❌ CRUD test error', err.message);
            }
        }
        
        // Test 5: Attendance
        async function testAttendance() {
            clearResults('attendanceResults');
            addResult('attendanceResults', 'info', '📋 Testing attendance marking...');
            
            try {
                const { data: { user } } = await supabase.auth.getUser();
                if (!user) {
                    addResult('attendanceResults', 'warn', '⚠️ Login required for attendance test');
                    return;
                }
                
                // Get first worker
                const { data: workers } = await supabase
                    .from('workers')
                    .select('*')
                    .eq('active', true)
                    .limit(1);
                
                if (!workers || workers.length === 0) {
                    addResult('attendanceResults', 'warn', '⚠️ No workers found');
                    return;
                }
                
                const worker = workers[0];
                const today = new Date().toISOString().split('T')[0];
                
                addResult('attendanceResults', 'info', `Testing with worker: ${worker.name}`);
                
                // Test marking attendance
                const { data, error } = await supabase
                    .rpc('apply_attendance_with_payment', {
                        p_worker_id: worker.id,
                        p_work_date: today,
                        p_status: 'present',
                        p_wage_amount: worker.daily_rate,
                        p_payment_amount: 0
                    });
                
                if (error) {
                    addResult('attendanceResults', 'fail', '❌ Attendance marking failed', error.message);
                    
                    // Check if function exists
                    addResult('attendanceResults', 'info', 'Checking if function exists...');
                    const { error: funcError } = await supabase.rpc('apply_attendance_with_payment', {
                        p_worker_id: '00000000-0000-0000-0000-000000000000',
                        p_work_date: today,
                        p_status: 'present',
                        p_wage_amount: 0,
                        p_payment_amount: 0
                    });
                    
                    if (funcError && funcError.message.includes('Worker not found')) {
                        addResult('attendanceResults', 'pass', '✅ Function exists but worker not found');
                    } else if (funcError) {
                        addResult('attendanceResults', 'fail', '❌ Function might not exist', funcError.message);
                    }
                } else {
                    addResult('attendanceResults', 'pass', '✅ Attendance marking works', JSON.stringify(data));
                    
                    // Verify attendance saved
                    const { data: savedAtt } = await supabase
                        .from('attendance')
                        .select('*')
                        .eq('worker_id', worker.id)
                        .eq('work_date', today);
                    
                    if (savedAtt && savedAtt.length > 0) {
                        addResult('attendanceResults', 'pass', '✅ Attendance saved in database', `Status: ${savedAtt[0].status}`);
                    } else {
                        addResult('attendanceResults', 'fail', '❌ Attendance NOT saved in database');
                    }
                }
            } catch (err) {
                addResult('attendanceResults', 'fail', '❌ Attendance test error', err.message);
            }
        }
        
        // Test 6: Financial Calculations
        async function testFinancials() {
            clearResults('financialResults');
            addResult('financialResults', 'info', '🧮 Testing financial calculations...');
            
            try {
                const { data: { user } } = await supabase.auth.getUser();
                if (!user) {
                    addResult('financialResults', 'warn', '⚠️ Login required for financial test');
                    return;
                }
                
                // Get all workers
                const { data: workers } = await supabase
                    .from('workers')
                    .select('*')
                    .eq('active', true);
                
                if (!workers || workers.length === 0) {
                    addResult('financialResults', 'warn', '⚠️ No workers found');
                    return;
                }
                
                for (const worker of workers) {
                    // Get attendance
                    const { data: attendance } = await supabase
                        .from('attendance')
                        .select('*')
                        .eq('worker_id', worker.id);
                    
                    // Get transactions
                    const { data: transactions } = await supabase
                        .from('worker_transactions')
                        .select('*')
                        .eq('worker_id', worker.id);
                    
                    // Calculate totals
                    const totalWages = attendance?.reduce((sum, a) => sum + (a.wage_amount || 0), 0) || 0;
                    const totalPayments = attendance?.reduce((sum, a) => sum + (a.payment_amount || 0), 0) || 0;
                    
                    const totalAdvance = transactions
                        ?.filter(t => t.transaction_type === 'advance')
                        .reduce((sum, t) => sum + t.amount, 0) || 0;
                    
                    const totalPaid = transactions
                        ?.filter(t => t.transaction_type === 'payment')
                        .reduce((sum, t) => sum + t.amount, 0) || 0;
                    
                    const netBalance = totalWages - totalAdvance - totalPaid;
                    
                    addResult('financialResults', 'pass', `✅ ${worker.name}:`, 
                        `Wages: ₹${totalWages}, Advance: ₹${totalAdvance}, Paid: ₹${totalPaid}, Balance: ₹${netBalance}`);
                }
            } catch (err) {
                addResult('financialResults', 'fail', '❌ Financial test error', err.message);
            }
        }
        
        // Run ALL Tests
        async function runAllTests() {
            clearResults('allResults');
            addResult('allResults', 'info', '🚀 Running complete diagnostic...');
            
            await testSupabase();
            await testAuth();
            await testTables();
            await testWorkerCRUD();
            await testAttendance();
            await testFinancials();
            
            addResult('allResults', 'pass', '✅ All tests completed!');
        }
        
        // Auto-run on load
        window.addEventListener('DOMContentLoaded', () => {
            addResult('supabaseResults', 'info', 'Click "Test Supabase Connection" to start');
        });
    </script>
</body>
</html>
